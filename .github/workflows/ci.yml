name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustrelay
          POSTGRES_PASSWORD: trustrelay
          POSTGRES_DB: trustrelay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustrelay" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Security scan
        run: bandit -q -r app -ll
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Tests
        run: pytest -q
      - name: Migrations match models and downgrade cleanly
        env:
          TR_DATABASE_URL: postgresql+asyncpg://trustrelay:trustrelay@localhost:5432/trustrelay_test
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustrelay
          POSTGRES_PASSWORD: trustrelay
          POSTGRES_DB: trustrelay_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustrelay" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Web
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: web
        run: npx playwright test --trace off

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
